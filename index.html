<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow: hidden;
}

.login{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:300px;
}

input,button{
    padding:10px;
    font-size:16px;
}
</style>

</head>
<body>

<div class="login">
    <input id="user" placeholder="Platform (Roblox, VRChat, ...)">

    <input id="pass"
           type="password"
           placeholder="Guild (Playduo Studio, ROLVe, etc)">

    <button onclick="login()">
        Login
    </button>

    <p id="error"></p>
</div>

<script>

const accounts = {
    "Roblox":"Pinewood Builders",
    "Roblox":"Quantum Science",
    "VRCSupport":"Support123",
    "Global":"Developerlogin"
};

function login(){

    const username=document.getElementById("user").value;
    const password=document.getElementById("pass").value;

    if(accounts[username]===password){

        sessionStorage.setItem("loggedIn","true");
        sessionStorage.setItem("username",username);

        window.location.href="ZGFQQVVMX2hvbWUuaHRtbA==.html";

    }else{

        document.getElementById("error").innerHTML="Incorrect username or password.";

    }

}

</script>

</body>
</html>
